name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить структуру проекта
        run: |
          pwd
          ls -la
          ls -la repo

      - name: Сборка (установка зависимостей)
        run: |
          cd repo
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black isort flake8

      - name: Линтер flake8
        run: |
          cd repo
          flake8 src tests

      - name: Форматтер black и isort
        run: |
          cd repo
          black --check src tests
          isort --check-only src tests

      - name: Тесты и покрытие
        run: |
          cd repo
          pytest --cov=src --cov-report=term-missing

      - name: Сохранить отчет о покрытии
        if: always()
        run: echo "Проверка завершена"
